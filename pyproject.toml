[project]
name = "tammuz"
version = "0.1.0"
description = "Herakles arazi degisimi verisini isleyen, siniflandiran ve yayinlayan acik isleme hatti ve harita uygulamasi"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Orman Takip" }]
keywords = ["remote-sensing", "change-detection", "satellite", "gis", "geoparquet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.scripts]
tammuz = "tammuz.cli:app"

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "timm>=1.0",
]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-cov>=5",
    "pre-commit>=3",
]

[dependencies]
typer = ">=0.12"
rich = ">=13"
PyYAML = ">=6"
pydantic = ">=2"
numpy = ">=1.26"
Pillow = ">=10"
pyarrow = ">=15"
duckdb = ">=1.0"
polars = ">=1.0"
lancedb = ">=0.10"
fastapi = ">=0.110"
uvicorn = ">=0.29"
openai = ">=1.40"
tqdm = ">=4.66"
scikit-learn = ">=1.4"
scipy = ">=1.12"
orjson = ">=3.10"
requests = ">=2.32"
huggingface_hub = ">=0.24"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/tammuz/cli.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["tammuz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
